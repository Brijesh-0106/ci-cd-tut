name: CI/CD Tutorial

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clone code
        uses: actions/checkout@v3
      - name: Node SetUp
        uses: actions/setup-node@v3
      - name: Install Dependency
        run: npm install
      - name: Run Lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Clone code
        uses: actions/checkout@v3
      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: Docker push
        run: |
          docker build -t brijesh408/ci_cd_tut-${{github.run_number}} .
          docker push brijesh408/ci_cd_tut-${{github.run_number}}
