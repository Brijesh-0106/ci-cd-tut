name: CI/CD Tutorial

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clone code
        uses: actions/checkout@v3
      - name: Node SetUp
        uses: actions/setup-node@v3
        with:
          node_version: "20"
          cache: "npm"
      - name: Install Dependency
        run: npm ci
      - name: Run Lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Clone code
        uses: actions/checkout@v3
      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: Docker push
        run: |
          docker build -t brijesh408/ci_cd_tut:${{github.run_number}} .
          docker push brijesh408/ci_cd_tut:${{github.run_number}}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: SSH in machine
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USER}}
          key: ${{secrets.SERVER_SSH_KEY}}
          script: |
            docker pull brijesh408/ci_cd_tut:${{github.run_number}} 
            docker stop ci_cd_tut || true
            docker rm ci_cd_tut || true
            docker run -p 5173:5173 --restart unless-stopped --name ci_cd_tut brijesh408/ci_cd_tut:${{github.run_number}}
